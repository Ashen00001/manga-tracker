<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manga">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="icon" href="/icon.png">
  <title>Manga Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Home">
      <img src="/icon.png" alt="" width="28" height="28">
      <span>Manga Tracker</span>
    </a>
    <form id="search-form" class="search" role="search">
      <input id="search-input" type="search" placeholder="Search a series or volume…" autocomplete="off" enterkeyhint="search" aria-label="Search manga">
    </form>
    <a href="#/watching" class="nav-link" id="nav-watching">Watching</a>
  </header>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
